name: Aktualizácia liturgických poriadkov

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poriadky.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'site/**'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sambron-pages
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Načítať farské poriadky
        run: python scripts/importuj.py
      - name: Uložiť zmeny rozpisu
        run: |
          if ! git diff --quiet -- site/poriadky.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/poriadky.json
            git commit -m "Aktualizácia liturgických poriadkov"
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publish:
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Zverejniť prehľad
        id: deployment
        uses: actions/deploy-pages@v4
