name: Kontrola formátov farských poriadkov
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audituj.py'
      - '.github/workflows/audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/audituj.py
